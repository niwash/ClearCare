name: AWS rollback

# Moves the site or the API back to an earlier task-definition revision. The
# ECS console, or aws ecs list-task-definitions, lists the revisions. A
# rollback does not undo migrations.
on:
  workflow_dispatch:
    inputs:
      service:
        description: The service to roll back
        type: choice
        options: [api, web]
      revision:
        description: The task-definition revision to run, such as 12
        required: true

permissions:
  contents: read
  id-token: write

# One change to production at a time. GitHub keeps at most one run waiting
# in the group; a newer one replaces it.
concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  rollback:
    if: vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/clearcare-github-deploy
          aws-region: eu-north-1
      - env:
          SERVICE: ${{ inputs.service }}
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! $REVISION =~ ^[0-9]+$ ]]; then
            echo "revision must be a number, got '$REVISION'" >&2
            exit 1
          fi
          infra/aws/bin/update-service "$SERVICE" "clearcare-$SERVICE:$REVISION"
