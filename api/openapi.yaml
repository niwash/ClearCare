openapi: 3.1.0
info:
  title: ClearCare API
  version: 0.1.0
  description: >
    Reads the HIQA register data that ClearCare has loaded. The web site and
    the Java code both follow this file. Property names are snake_case, the
    same as the database views.

paths:
  /centres:
    get:
      operationId: searchCentres
      summary: Search the centres in the published register snapshot
      description: |
        Returns centres from the register snapshot that ClearCare currently
        serves. Every parameter is optional. When several are given, a centre
        must match all of them. With none, every centre is returned, one page
        at a time.

        `name` and `address` are compared after folding: accents are removed
        (`aras` finds "Áras"), case is ignored, apostrophes are dropped
        (`joseph's`, `joseph’s` and `josephs` are the same), and every other
        character that is not a letter or a digit separates words. Each word
        of the input must be the start of a word in the field, in any order:
        `hall elm` finds "Elm Hall Nursing Home", but `lm` does not. `St` and
        `Saint` are different words. A value that is blank, or has no letters
        or digits, is ignored.

        `care_type`, `room_type`, `facility` and `activity` filter by what
        the centre's latest extracted inspection report mentions, read by a
        model: the same record `GET /centres/{centre_id}/amenities` serves
        with `version=amenities-v2`. Each takes exact item names from the
        amenities-v2 lists and may be repeated. A centre matches `care_type`,
        `facility` and `activity` when its report mentions every value given,
        and `room_type` when it mentions any of them. A report that does not
        mention an item does not show the centre lacks it, and a centre with
        no extracted report matches none of these four.

        `sort=name` orders centres by their folded name, character by
        character in code order (so a space comes before any letter), then by
        `centre_id` as a number. `sort=latest_inspection` orders them by the
        inspection date of their newest loaded report, newest first; centres
        whose newest report has no date come last, together with centres
        without a report, and ties are in name order. Results are not ranked.

        An unknown parameter, an unknown item name or sort, or a parameter
        other than the four filters given more than once, is refused with
        400. A filter value given twice counts once.
      parameters:
        - name: name
          in: query
          description: Words that start words of the centre's name.
          schema:
            type: string
            maxLength: 100
          example: hall elm
        - name: address
          in: query
          description: >
            Words that start words of the centre's address, such as a town.
            Most addresses do not name their county, so use `county` to search
            by county.
          schema:
            type: string
            maxLength: 100
          example: celbridge
        - name: eircode
          in: query
          description: >
            A routing key (`W23`, `D6W`) finds every Eircode that starts with
            it. A full Eircode (`W23 P6EX`) finds only itself. Spaces are
            removed and letters made upper case first. Only the letters and
            digits used in Eircodes are accepted, and `O` is not read as `0`.
          schema:
            type: string
          example: W23
        - name: county
          in: query
          description: A county, spelt as on the register. Case matters.
          schema:
            $ref: "#/components/schemas/County"
          example: Dublin
        - name: care_type
          in: query
          description: >
            Care types the centre's latest extracted report must all mention. Exact item names; case matters. May be repeated.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CareTypeItem"
          example: ["Dementia care", "Respite care"]
        - name: room_type
          in: query
          description: >
            Room types of which the centre's latest extracted report must mention at least one. Exact item names; case matters. May be repeated.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RoomTypeItem"
          example: ["Single room"]
        - name: facility
          in: query
          description: >
            Facilities the centre's latest extracted report must all mention. Exact item names; case matters. May be repeated.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/FacilityItem"
          example: ["Garden"]
        - name: activity
          in: query
          description: >
            Activities the centre's latest extracted report must all mention. Exact item names; case matters. May be repeated.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ActivityItem"
          example: ["Bingo"]
        - name: sort
          in: query
          description: The order of the results, as described above.
          schema:
            type: string
            enum: [name, latest_inspection]
            default: name
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: >
            One page of the matching centres. A page past the last one has no
            centres, and `total` is still the number of matches. No matches
            give `"centres": []` and `"total": 0`. `facets` and `sort` are
            present on every page, whatever `page_size`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentreSearchResult"
              example:
                centres:
                  - centre_id: "34"
                    centre_name: Elm Hall Nursing Home
                    address: Elm Hall Nursing Home, Loughlinstown Road, Celbridge, W23 P6EX
                    county: Kildare
                    eircode: W23P6EX
                    maximum_occupancy: 62
                    hiqa_url: https://www.hiqa.ie/areas-we-work/find-a-centre/elm-hall-nursing-home
                    amenities:
                      report_id: 112
                      inspection_date: "2026-01-15"
                      care_types: ["Long-term residential care", "Respite care"]
                      room_types: ["Single room", "Twin/double room"]
                      activities: ["Music and singing", "Bingo"]
                      facilities: ["Garden", "Lounge/day room"]
                    fair_deal: true
                    latest_inspection:
                      date: "2026-01-15"
                page: 1
                page_size: 20
                total: 1
                register_snapshot:
                  fetched_at: "2026-10-05T06:12:54Z"
                  url: https://www.hiqa.ie/centre/export/older_persons_register.csv?_format=csv
                  sha256: c24a105a5f1df7026a9e1a86977273f9987b07c3137fb21fed8265a18cd90337
                facets:
                  care_type: {"Dementia care": 0, "Respite care": 1}
                  room_type: {"Single room": 1, "Twin/double room": 1}
                  facility: {"Garden": 1, "Courtyard": 0}
                  activity: {"Bingo": 1, "Dancing": 0}
                  fair_deal: 1
                sort: name
        "400":
          description: >
            A parameter is unknown, given more than once where it may not be,
            too long, out of range, not of the expected type or shape, or an
            item name or sort the API does not know.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
                detail: page_size must be between 1 and 50
                instance: /centres
        "503":
          description: No register snapshot has been loaded yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Service Unavailable
                status: 503
                detail: The register has not been loaded yet.
                instance: /centres

  /centres/{centre_id}:
    get:
      operationId: getCentre
      summary: Get one centre from the published register snapshot
      description: |
        Returns the centre with this `centre_id` from the register snapshot
        that ClearCare currently serves, with the fields of a search result,
        the centre's phone number, the latest contract price published for it
        and the kind of home that price is for.

        Any value that is not the ID of a centre in that snapshot gives 404,
        including one that is not a number.
      parameters:
        - name: centre_id
          in: path
          required: true
          description: HIQA's centre ID.
          schema:
            type: string
            pattern: "^[0-9]+$"
          example: "34"
      responses:
        "200":
          description: The centre, and the register snapshot it was read from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentreResult"
              example:
                centre:
                  centre_id: "34"
                  centre_name: Elm Hall Nursing Home
                  address: Elm Hall Nursing Home, Loughlinstown Road, Celbridge, W23 P6EX
                  county: Kildare
                  eircode: W23P6EX
                  maximum_occupancy: 62
                  hiqa_url: https://www.hiqa.ie/areas-we-work/find-a-centre/elm-hall-nursing-home
                  centre_phone: "01 555 0123"
                register_snapshot:
                  fetched_at: "2026-10-05T06:12:54Z"
                  url: https://www.hiqa.ie/centre/export/older_persons_register.csv?_format=csv
                  sha256: c24a105a5f1df7026a9e1a86977273f9987b07c3137fb21fed8265a18cd90337
                contract_price: 1908.00
                home_type: public
        "404":
          description: The register snapshot has no centre with this ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Not Found
                status: 404
                detail: The register has no centre with this centre_id.
                instance: /centres/999
        "503":
          description: No register snapshot has been loaded yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Service Unavailable
                status: 503
                detail: The register has not been loaded yet.
                instance: /centres/34

  /centres/{centre_id}/reports:
    get:
      operationId: listCentreReports
      summary: List a centre's inspection reports
      description: |
        Returns the inspection reports ClearCare has loaded for this centre,
        newest inspection first, each with how many inspectors, regulations and
        compliance items it holds. `GET /reports/{report_id}` returns one of
        them in full.

        The centre must be in the register snapshot ClearCare currently serves.
        Any value that is not the ID of such a centre gives 404, including one
        that is not a number. A centre with no reports gives `"reports": []`.
      parameters:
        - name: centre_id
          in: path
          required: true
          description: HIQA's centre ID.
          schema:
            type: string
            pattern: "^[0-9]+$"
          example: "34"
      responses:
        "200":
          description: The centre's reports, newest inspection first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentreReportsResult"
              example:
                centre_id: "34"
                reports:
                  - report_id: 1
                    inspection_type: Unannounced
                    inspection_date: "2026-05-13"
                    fieldwork_id: MON-0050709
                    residents: 48
                    inspector_count: 2
                    regulation_count: 12
                    compliance_item_count: 18
        "404":
          description: The register snapshot has no centre with this ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Not Found
                status: 404
                detail: The register has no centre with this centre_id.
                instance: /centres/999/reports
        "503":
          description: No register snapshot has been loaded yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Service Unavailable
                status: 503
                detail: The register has not been loaded yet.
                instance: /centres/34/reports

  /centres/{centre_id}/findings:
    get:
      operationId: listCentreFindings
      summary: List a centre's findings, with their report text and re-assessment
      description: |
        Returns the findings of the reports ClearCare has loaded for this
        centre: each regulation a report judged Substantially compliant or Not
        compliant. Each comes with what the inspector wrote about it, the
        provider's response, the deadlines the provider stated, and when the
        regulation was next judged (ADR-0024). Newest inspection first, each
        report's findings together, by regulation number.

        Text is served verbatim, as extracted at one pinned extractor version:
        headings, "Judgment:" lines and the words of the response form
        included. Text that was not extracted at that version is null; that
        does not mean the report has none. Pages are PDF page positions,
        counted from the first page, cover included.

        The centre must be in the register snapshot ClearCare currently serves.
        Any value that is not the ID of such a centre gives 404, including one
        that is not a number. A centre with no findings gives `"findings": []`.
      parameters:
        - name: centre_id
          in: path
          required: true
          description: HIQA's centre ID.
          schema:
            type: string
            pattern: "^[0-9]+$"
          example: "34"
      responses:
        "200":
          description: The centre's findings, newest inspection first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentreFindingsResult"
              example:
                centre_id: "34"
                findings:
                  - report_id: 1
                    inspection_date: "2024-08-16"
                    report_url: https://www.hiqa.ie/sites/default/files/2024-10/elm-hall.pdf
                    regulation: Regulation 28
                    title: Fire precautions
                    judgment: Not compliant
                    compliance_items:
                      - regulation: Regulation 28(1)(a)
                        risk_rating: Yellow
                        date_to_comply: "2024-10-16"
                    inspector:
                      text: |
                        Regulation 28: Fire precautions
                        The kitchen ductwork had not been cleaned.
                        Judgment: Not compliant
                      first_page: 11
                      last_page: 12
                    provider_response:
                      text: |
                        Regulation 28: Fire precautions Not Compliant
                        The ductwork will be cleaned by 30/09/2024.
                      first_page: 18
                      last_page: 18
                    stated_deadlines:
                      - text: The ductwork will be cleaned by 30/09/2024.
                        stated_deadline: "2024-09-30"
                        stated_deadline_text: 30/09/2024
                        deadline_precision: day
                        page: 18
                        last_page: 18
                    re_assessment:
                      status: re-assessed
                      report_id: 2
                      inspection_date: "2025-01-11"
                      report_url: https://www.hiqa.ie/sites/default/files/2025-02/elm-hall.pdf
                      judgment: Compliant
                      reports_between: 0
                      inspector:
                        text: |
                          Regulation 28: Fire precautions
                          Fire drills were held regularly.
                          Judgment: Compliant
                        first_page: 11
                        last_page: 11
        "404":
          description: The register snapshot has no centre with this ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Not Found
                status: 404
                detail: The register has no centre with this centre_id.
                instance: /centres/999/findings
        "503":
          description: No register snapshot has been loaded yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Service Unavailable
                status: 503
                detail: The register has not been loaded yet.
                instance: /centres/34/findings

  /centres/{centre_id}/amenities:
    get:
      operationId: getCentreAmenities
      summary: Get what a centre offers its residents
      description: |
        The default (or version=amenities-v1) preserves the legacy response,
        including amenities-v0/v1 extractions. Request version=amenities-v2
        for the four fixed-category lists with item-level quote/page evidence.
        Versions never fall back to each other's data. Empty v2 lists mean
        no confirmed items, not absence. Quotes are model output, not verified fact.

        Returns the amenities read from the centre's newest inspection report
        that has them: the types of care and room, activities, special units,
        and whether there is outdoor space, transport or a chapel or religious
        services. They are values a model (gpt-4o-mini) read from the whole
        report text, with the report they came from. Provider text and
        inspector observations are not separated yet. `inspection_date` and
        `report_id` say which report they come from, and
        `GET /reports/{report_id}` returns it.

        A flag is `true` or `false` when the report says so and `null` when
        it is silent. `null` does not mean the centre has none.

        The centre must be in the register snapshot ClearCare currently serves.
        Any value that is not the ID of such a centre gives 404, including one
        that is not a number. A centre with no amenities yet gives
        `"amenities": null`.
      parameters:
        - name: version
          in: query
          required: false
          description: Select the response contract; defaults to legacy v1.
          schema:
            type: string
            enum: [amenities-v1, amenities-v2]
            default: amenities-v1
        - name: centre_id
          in: path
          required: true
          description: HIQA's centre ID.
          schema:
            type: string
            pattern: "^[0-9]+$"
          example: "34"
      responses:
        "200":
          description: The centre's amenities, or null if there are none yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentreAmenitiesResult"
              example:
                centre_id: "34"
                amenities:
                  report_id: 1
                  inspection_date: "2026-05-13"
                  care_types: [long-term residential, dementia care]
                  room_types: [single room, en-suite]
                  has_outdoor_space: true
                  activities: [physiotherapy, music therapy]
                  has_transport: null
                  has_chapel_or_religious_services: true
                  special_units: [memory care unit]
                  dining_notes: Meals are served in the dining room.
                  other_notes: Views over the garden.
                  extractor_version: amenities-v1
                  model: gpt-4o-mini
        "400":
          description: Unsupported amenities version.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The register snapshot has no centre with this ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: No register snapshot has been loaded yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /reports/{report_id}:
    get:
      operationId: getReport
      summary: Get one inspection report in full
      description: |
        Returns one report: the cover values the parser read, the stored PDF
        they came from, the inspectors the report names, the regulations it
        considered, and its compliance plan.

        The report does not have to be about a centre in the register snapshot
        ClearCare currently serves; a report is served as soon as it is loaded.
        Any value that is not the ID of a report gives 404, including one that
        is not a number.
      parameters:
        - name: report_id
          in: path
          required: true
          description: ClearCare's ID for the report.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "200":
          description: The report, in full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"
              example:
                report:
                  report_id: 1
                  centre_id: "34"
                  centre_code: OSV-0000034
                  centre_name: Elm Hall Nursing Home
                  provider_name: Springwood Nursing Homes Limited
                  address: Elm Hall Nursing Home, Loughlinstown Road, Celbridge, W23 P6EX
                  inspection_type: Unannounced
                  inspection_date: "2026-05-13"
                  fieldwork_id: MON-0050709
                  residents: 48
                  report_file:
                    sha256: 6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b
                    url: https://www.hiqa.ie/sites/default/files/2026-06/elm-hall.pdf
                    fetched_at: "2026-06-01T09:15:00Z"
                  inspectors:
                    - date: "2026-05-13"
                      start_time: "09:00:00"
                      end_time: "17:20:00"
                      name: A. Inspector
                      role: Lead
                  regulations:
                    - regulation: Regulation 15
                      title: Staffing
                      judgment: Compliant
                  compliance_items:
                    - regulation: Regulation 16(1)(a)
                      requirement: Staff receive appropriate training.
                      judgment: Not Compliant
                      risk_rating: Orange
                      date_to_comply: "2026-09-01"
        "404":
          description: There is no report with this ID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Not Found
                status: 404
                detail: There is no report with this report_id.
                instance: /reports/999

  /statistics/re-assessment:
    get:
      operationId: getReAssessmentStatistics
      summary: Count what each judgment became at the centre's next report
      description: |
        Counts the judgments of every loaded report by what the same centre's
        next report said about the regulation, as defined in
        ADR-0015: judged again, not
        re-assessed (the next report does not list the regulation), or no
        later report. Each count comes with its denominator, so the rates can
        be checked.

        Only loaded reports are counted. Reports whose layout cannot be
        loaded yet, such as thematic reports (ADR-0013), are
        passed over, so the next report is the next one ClearCare has
        loaded.
      responses:
        "200":
          description: >
            The counts, one row per starting judgment, in the order Compliant,
            Substantially compliant, Not compliant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReAssessmentStatistics"
              example:
                matrix:
                  - judgment: Compliant
                    compliant: 1
                    substantially_compliant: 0
                    not_compliant: 0
                    not_re_assessed: 3
                    no_later_report: 1
                    total: 5
                  - judgment: Substantially compliant
                    compliant: 0
                    substantially_compliant: 0
                    not_compliant: 1
                    not_re_assessed: 1
                    no_later_report: 0
                    total: 2
                  - judgment: Not compliant
                    compliant: 1
                    substantially_compliant: 1
                    not_compliant: 0
                    not_re_assessed: 0
                    no_later_report: 2
                    total: 4
                re_check_rate:
                  - judgment: Compliant
                    with_later_report: 4
                    re_assessed: 1
                    rate: 0.25
                  - judgment: Substantially compliant
                    with_later_report: 2
                    re_assessed: 1
                    rate: 0.5
                  - judgment: Not compliant
                    with_later_report: 2
                    re_assessed: 2
                    rate: 1.0
                coverage:
                  reports_loaded: 4
                  centres_with_two_or_more_reports: 1
                  reports_paired: 2
                  judgments_paired: 8
                data_date: "2026-05-13"
        "503":
          description: No report with an inspection date has been loaded yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Service Unavailable
                status: 503
                detail: No inspection reports have been loaded yet.
                instance: /statistics/re-assessment

  /preferences:
    get:
      operationId: getSavedSearch
      summary: The signed-in visitor's saved search
      description: |
        Returns the search this account asked the site to remember: the county,
        the order and the ticked filter options, so the search page can offer it
        again on a later visit. With nothing saved, `preferences` and
        `updated_at` are null.

        The account is named by the site's own server, not by the browser: the
        site reads its session cookie (ADR-0020), takes the account's Cognito
        subject and sends it with a token the site and the API share (ADR-0024).
        A request without that token is refused with 401, and these paths answer
        503 while no token is configured, so a deployment without one keeps
        working as it did.
      parameters:
        - name: X-ClearCare-Sub
          in: header
          required: true
          description: >
            The account's Cognito subject claim, sent by the site's server only.
          schema:
            type: string
            maxLength: 128
        - name: X-ClearCare-Token
          in: header
          required: true
          description: The token the site's server and the API share.
          schema:
            type: string
      responses:
        "200":
          description: The saved search, or null when the account has not saved one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearchResult"
              example:
                preferences:
                  county: Cork
                  care_types: [dementia, respite]
                  room_types: []
                  facilities: [garden]
                  activities: []
                  sort_by: latest_inspection
                updated_at: "2026-11-05T09:12:44Z"
        "401":
          description: >
            No subject, or a token that is not the site's: the request did not
            come from the site.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Unauthorized
                status: 401
                detail: The request is not from the site.
                instance: /preferences
        "503":
          description: This API has no token configured, so it keeps no saved searches.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Service Unavailable
                status: 503
                detail: Saved searches are not configured on this API.
                instance: /preferences

    put:
      operationId: saveSearch
      summary: Keep a search for this account
      description: |
        Replaces the account's saved search with this one. There is one per
        account, so saving again is a change of the same choice rather than a
        second search. The answer is what was stored.

        A document the search page could not have produced is refused with 400:
        an option that is not a slug of lower-case letters, digits and hyphens,
        an order that is not `name` or `latest_inspection`, or more options than
        a page can hold. Lists that are left out are stored empty, and a missing
        `sort` is stored as `name`.
      parameters:
        - name: X-ClearCare-Sub
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
        - name: X-ClearCare-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearch"
            example:
              county: Cork
              care_types: [dementia]
              room_types: []
              facilities: [garden]
              activities: []
              sort_by: name
      responses:
        "200":
          description: The saved search as it is now stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearchResult"
        "400":
          description: >
            Not a search the site could have sent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
                detail: sort must be name or latest_inspection
                instance: /preferences
        "401":
          description: The request did not come from the site.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: This API has no token configured.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

    delete:
      operationId: forgetSavedSearch
      summary: Forget this account's saved search
      description: >
        Deletes the account's saved search. An account with nothing saved is
        answered the same way, so this can be repeated.
      parameters:
        - name: X-ClearCare-Sub
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
        - name: X-ClearCare-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The account has no saved search now.
        "401":
          description: The request did not come from the site.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: This API has no token configured.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    CentreSearchResult:
      type: object
      required: [centres, page, page_size, total, register_snapshot, facets, sort]
      properties:
        centres:
          type: array
          items:
            $ref: "#/components/schemas/CentreSummary"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          description: The number of matching centres on all pages.
        register_snapshot:
          $ref: "#/components/schemas/RegisterSnapshot"
        facets:
          $ref: "#/components/schemas/Facets"
        sort:
          type: string
          enum: [name, latest_inspection]
          description: The order applied to the results.

    CentreSummary:
      description: >
        A centre as a search result: its register entry, what its latest
        extracted report mentions, and the date of its newest inspection.
      allOf:
        - $ref: "#/components/schemas/Centre"
        - type: object
          required: [amenities, fair_deal, latest_inspection]
          properties:
            amenities:
              description: >
                The items the centre's latest extracted report mentions, as
                `GET /centres/{centre_id}/amenities?version=amenities-v2`
                serves them but without the evidence. null when no report of
                the centre has been read yet. An item that is missing is not
                confirmed absent.
              oneOf:
                - $ref: "#/components/schemas/MentionedAmenities"
                - type: "null"
            fair_deal:
              type: boolean
              description: >
                Whether a contract price is stored for the centre, the one
                `GET /centres/{centre_id}` returns as `contract_price`. It
                does not show that the centre is on the newest HSE list.
            latest_inspection:
              description: >
                The centre's newest loaded inspection report, or null when
                none has been loaded.
              oneOf:
                - type: object
                  required: [date]
                  properties:
                    date:
                      type: [string, "null"]
                      format: date
                      description: >
                        The inspection date; null when the report does not
                        give one.
                - type: "null"

    MentionedAmenities:
      type: object
      additionalProperties: false
      required: [report_id, inspection_date, care_types, room_types, activities, facilities]
      properties:
        report_id:
          type: integer
          format: int64
          description: >
            The report the items were read from, for `GET /reports/{report_id}`.
        inspection_date:
          type: [string, "null"]
          format: date
          description: >
            That report's inspection date. It can be older than
            `latest_inspection`, because the newest report may not have been
            read yet.
        care_types:
          type: array
          items:
            $ref: "#/components/schemas/CareTypeItem"
        room_types:
          type: array
          items:
            $ref: "#/components/schemas/RoomTypeItem"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        facilities:
          type: array
          items:
            $ref: "#/components/schemas/FacilityItem"

    Facets:
      type: object
      description: >
        For every item of every list, how many centres would match if that
        item were also given, with the other parameters as they are: added to
        the all-of values for `care_type`, `facility` and `activity`, and to
        the any-of values for `room_type`. Every item is a key, those that
        match no centre with 0. `fair_deal` is how many of the matching
        centres have a stored contract price.
      required: [care_type, room_type, facility, activity, fair_deal]
      properties:
        care_type:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        room_type:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        facility:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        activity:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        fair_deal:
          type: integer
          minimum: 0

    CentreResult:
      type: object
      required: [centre, register_snapshot, contract_price, home_type]
      properties:
        centre:
          $ref: "#/components/schemas/CentreDetail"
        register_snapshot:
          $ref: "#/components/schemas/RegisterSnapshot"
        contract_price:
          type: [number, "null"]
          description: >
            The latest published contract price for the centre, in euro per
            resident per week. Null when no price list has been loaded for it.
          example: 1908.00
        home_type:
          type: [string, "null"]
          enum: [public, private, null]
          description: >
            The kind of home the contract price is for: "public" for a public
            nursing home or "private" for a private or voluntary one, taken
            from the price list it came from. Null when no price list has been
            loaded for the centre.
          example: public

    CentreDetail:
      description: >
        A centre as `GET /centres/{centre_id}` returns it: the fields of a
        search result and the centre's phone number.
      allOf:
        - $ref: "#/components/schemas/Centre"
        - type: object
          required: [centre_phone]
          properties:
            centre_phone:
              type: [string, "null"]
              description: >
                The centre's phone number as the register prints it, which is
                not always one number: a few say TBC or give two. null when the
                register gives none, or the snapshot was loaded before
                ClearCare kept it.

    Centre:
      type: object
      description: A centre's entry in the register snapshot, as HIQA wrote it.
      required:
        - centre_id
        - centre_name
        - address
        - county
        - eircode
        - maximum_occupancy
        - hiqa_url
      properties:
        centre_id:
          type: string
          pattern: "^[0-9]+$"
          description: HIQA's centre ID.
        centre_name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        county:
          type: string
          minLength: 1
        eircode:
          type: [string, "null"]
          description: >
            Upper case, without spaces. null when the address does not end in
            a valid Eircode.
        maximum_occupancy:
          type: [integer, "null"]
          minimum: 0
          description: >
            The most residents HIQA registered the centre for. It is not the
            number of free beds.
        hiqa_url:
          type: string
          format: uri
          description: The centre's page on hiqa.ie.

    RegisterSnapshot:
      type: object
      description: The register file these results were read from.
      required: [fetched_at, url, sha256]
      properties:
        fetched_at:
          type: string
          format: date-time
          description: >
            When ClearCare downloaded the register, in UTC to the second
            (YYYY-MM-DDTHH:MM:SSZ).
        url:
          type: string
          format: uri
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The SHA-256 of the downloaded file.

    County:
      type: string
      enum:
        - Carlow
        - Cavan
        - Clare
        - Cork
        - Donegal
        - Dublin
        - Galway
        - Kerry
        - Kildare
        - Kilkenny
        - Laois
        - Leitrim
        - Limerick
        - Longford
        - Louth
        - Mayo
        - Meath
        - Monaghan
        - Offaly
        - Roscommon
        - Sligo
        - Tipperary
        - Waterford
        - Westmeath
        - Wexford
        - Wicklow

    CentreReportsResult:
      type: object
      required: [centre_id, reports]
      properties:
        centre_id:
          type: string
          pattern: "^[0-9]+$"
          description: HIQA's centre ID.
        reports:
          type: array
          description: The centre's reports, newest inspection first.
          items:
            $ref: "#/components/schemas/CentreReport"

    CentreReport:
      type: object
      description: >
        One inspection report of a centre, as the centre's page lists it: enough
        to choose one, and how much it holds.
      required:
        - report_id
        - inspection_type
        - inspection_date
        - fieldwork_id
        - residents
        - inspector_count
        - regulation_count
        - compliance_item_count
      properties:
        report_id:
          type: integer
          format: int64
          description: >
            ClearCare's ID for the report. `GET /reports/{report_id}` returns
            the report in full.
        inspection_type:
          type: [string, "null"]
        inspection_date:
          type: [string, "null"]
          format: date
          description: The date of the inspection, not of the report.
        fieldwork_id:
          type: string
          description: HIQA's Fieldwork ID.
        residents:
          type: [integer, "null"]
          minimum: 0
        inspector_count:
          type: integer
        regulation_count:
          type: integer
        compliance_item_count:
          type: integer

    CentreFindingsResult:
      type: object
      required: [centre_id, findings]
      properties:
        centre_id:
          type: string
          pattern: "^[0-9]+$"
          description: HIQA's centre ID.
        findings:
          type: array
          description: >
            The centre's findings, newest inspection first, each report's
            findings together, by regulation number.
          items:
            $ref: "#/components/schemas/Finding"

    Finding:
      type: object
      description: >
        One regulation a report judged Substantially compliant or Not
        compliant. A regulation the report lists twice is one finding, with
        the judgment Appendix 1 gives.
      required:
        - report_id
        - inspection_date
        - report_url
        - regulation
        - title
        - judgment
        - compliance_items
        - inspector
        - provider_response
        - stated_deadlines
        - re_assessment
      properties:
        report_id:
          type: integer
          format: int64
          description: >
            The report that made the finding. `GET /reports/{report_id}`
            returns it in full.
        inspection_date:
          type: [string, "null"]
          format: date
        report_url:
          type: string
          format: uri
          description: The report's PDF, the `report_file.url` of the report.
        regulation:
          type: string
          minLength: 1
          description: The regulation's number, such as Regulation 28.
        title:
          type: string
          minLength: 1
          description: Its title, such as Fire precautions.
        judgment:
          type: string
          minLength: 1
          description: >
            As the report prints it: Substantially compliant or Not compliant,
            in any capitalisation.
        compliance_items:
          type: array
          description: >
            The items of the report's compliance plan under this regulation,
            such as Regulation 28(1)(a), in the order the report prints them.
          items:
            $ref: "#/components/schemas/FindingComplianceItem"
        inspector:
          description: What the inspector wrote under this regulation, or null.
          oneOf:
            - $ref: "#/components/schemas/ReportText"
            - type: "null"
        provider_response:
          description: >
            The provider's response to the finding in the compliance plan, or
            null.
          oneOf:
            - $ref: "#/components/schemas/ReportText"
            - type: "null"
        stated_deadlines:
          type: [array, "null"]
          description: >
            The commitments in the response that state a deadline the splitter
            could read, in the order the response gives them. The response's
            other words are in `provider_response`. `[]` when the response was
            split and no commitment states such a deadline; null when there is
            no response, or it has not been split at the pinned splitter
            version.
          items:
            $ref: "#/components/schemas/StatedDeadline"
        re_assessment:
          $ref: "#/components/schemas/ReAssessment"

    FindingComplianceItem:
      type: object
      description: One item of the compliance plan under a finding's regulation.
      required: [regulation, risk_rating, date_to_comply]
      properties:
        regulation:
          type: string
          minLength: 1
          description: The requirement's number, such as Regulation 28(1)(a).
        risk_rating:
          type: [string, "null"]
        date_to_comply:
          type: [string, "null"]
          format: date

    ReportText:
      type: object
      description: A passage of a report, verbatim, with the pages it spans.
      required: [text, first_page, last_page]
      properties:
        text:
          type: string
          minLength: 1
        first_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
          description: At least first_page.

    StatedDeadline:
      type: object
      description: >
        A commitment in the provider's response, with the deadline the
        provider stated for it (ADR-0017).
      required:
        - text
        - stated_deadline
        - stated_deadline_text
        - deadline_precision
        - page
        - last_page
      properties:
        text:
          type: string
          minLength: 1
          description: >
            The commitment's words, an exact span of the response. A span can
            combine actions or carry context, so it is not one promise.
        stated_deadline:
          type: string
          format: date
          description: >
            The deadline as a date. With month precision it is the last day of
            that month, which the provider did not state.
        stated_deadline_text:
          type: string
          minLength: 1
          description: The deadline as the response prints it.
        deadline_precision:
          type: string
          enum: [day, month]
        page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
          description: At least page.

    ReAssessment:
      type: object
      description: >
        When the finding's regulation was next judged: the first later report
        of the same centre that judges it, with any judgment (ADR-0024). Only
        loaded reports with an inspection date are later reports.
      required:
        - status
        - report_id
        - inspection_date
        - report_url
        - judgment
        - reports_between
        - inspector
      properties:
        status:
          type: string
          enum: [re-assessed, not re-assessed, no later report, order unknown]
          description: >
            `re-assessed`: a later report judged the regulation again, and the
            other properties describe it. `not re-assessed`: the centre has
            later reports, and none of them judges the regulation. `no later
            report`: the finding's report is the centre's latest.
            `order unknown`: the finding's report has no inspection date, or
            the centre has two reports on the date the regulation was next
            judged, so which came first is not known. The other properties are
            null unless the status is `re-assessed`.
        report_id:
          type: [integer, "null"]
          format: int64
          description: The report that judged the regulation again.
        inspection_date:
          type: [string, "null"]
          format: date
        report_url:
          type: [string, "null"]
          format: uri
          description: That report's PDF.
        judgment:
          type: [string, "null"]
          description: That report's judgment of the regulation, as printed.
        reports_between:
          type: [integer, "null"]
          minimum: 0
          description: >
            The centre's dated reports between the two inspections, none of
            which judged the regulation.
        inspector:
          description: >
            What that report's inspector wrote under the regulation, or null.
          oneOf:
            - $ref: "#/components/schemas/ReportText"
            - type: "null"

    CentreAmenitiesResult:
      type: object
      required: [centre_id, amenities]
      properties:
        centre_id:
          type: string
          pattern: "^[0-9]+$"
          description: HIQA's centre ID.
        amenities:
          description: The centre's amenities, or null if none have been read yet.
          oneOf:
            - $ref: "#/components/schemas/CentreAmenities"
            - $ref: "#/components/schemas/CentreAmenitiesV2"
            - type: "null"

    AmenityEvidence:
      type: object
      additionalProperties: false
      required: [quote, page_start, page_end]
      properties:
        quote:
          type: string
          minLength: 1
          description: Exact continuous source passage; content is not automatically verified.
        page_start:
          type: integer
          minimum: 1
        page_end:
          type: integer
          minimum: 1
          description: Inclusive end, at least page_start; same-page evidence repeats the page.

    CareTypeItem:
      type: string
      description: A care type from the amenities-v2 list, as the extractor names it.
      enum: ["General nursing care", "Long-term residential care", "Short-term care", "Respite care", "Convalescent care", "Transitional care", "Step-down care", "Rehabilitation", "Day care", "Dementia care", "Palliative care", "End-of-life care", "Acquired brain injury care", "Physical disability care", "Sensory impairment care", "Neurological care", "Intellectual disability care", "Mental health care"]

    RoomTypeItem:
      type: string
      description: A room type from the amenities-v2 list, as the extractor names it.
      enum: ["Single room", "Twin/double room", "Multi-bed room", "Shared room, occupancy unspecified", "En-suite facilities", "Shared bathroom facilities"]

    ActivityItem:
      type: string
      description: An activity from the amenities-v2 list, as the extractor names it.
      enum: ["Music and singing", "Dancing", "Drama and performances", "Arts and crafts", "Knitting and sewing", "Cooking and baking", "Gardening and flower arranging", "Bingo", "Quizzes and word games", "Board and card games", "Ball and movement games", "Reading and writing", "Talks and discussion groups", "Exercise classes", "Walking", "Outings", "Social gatherings and celebrations", "Men’s groups", "Films and television", "Radio", "Reminiscence activities", "Sensory activities", "Cognitive stimulation therapy", "Sonas", "Physiotherapy", "Occupational therapy", "Music therapy", "Art therapy", "Pet therapy", "Aromatherapy", "Meditation and relaxation", "Hairdressing", "Beauty and nail care", "Massage", "Religious services and prayer"]

    FacilityItem:
      type: string
      description: A facility from the amenities-v2 list, as the extractor names it.
      enum: ["Garden", "Courtyard", "Patio/terrace", "Balcony", "Outdoor space, type unspecified", "Lounge/day room", "Dining room", "Activities room", "Private visitors/family room", "Conservatory/sun room", "Quiet/relaxation room", "Chapel/oratory", "Prayer/reflection room", "Library", "Cinema room", "Games room", "Sensory room", "Gym", "Café/coffee dock", "Shop", "Hairdressing/beauty salon", "Designated smoking area", "Physiotherapy room", "Occupational therapy room", "Hydrotherapy pool/bathroom", "Resident internet/Wi-Fi", "Visitor parking", "Passenger lift", "Stairlift", "Dementia-specific unit", "Mental-health-specific unit", "Acquired-brain-injury unit", "Convalescence unit", "Centre-provided bus/car transport"]

    CentreAmenitiesV2:
      type: object
      additionalProperties: false
      required: [report_id, inspection_date, care_types, room_types, activities, facilities, extractor_version, model]
      properties:
        report_id:
          type: integer
          format: int64
        inspection_date:
          type: [string, "null"]
          format: date
        care_types:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item, evidence]
            properties:
              item:
                $ref: "#/components/schemas/CareTypeItem"
              evidence:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/AmenityEvidence"
        room_types:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item, evidence]
            properties:
              item:
                $ref: "#/components/schemas/RoomTypeItem"
              evidence:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/AmenityEvidence"
        activities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item, evidence]
            properties:
              item:
                $ref: "#/components/schemas/ActivityItem"
              evidence:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/AmenityEvidence"
        facilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item, evidence]
            properties:
              item:
                $ref: "#/components/schemas/FacilityItem"
              evidence:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/AmenityEvidence"
        extractor_version:
          type: string
          const: amenities-v2
        model:
          type: string
          minLength: 1

    CentreAmenities:
      type: object
      required:
        - report_id
        - inspection_date
        - care_types
        - room_types
        - has_outdoor_space
        - activities
        - has_transport
        - has_chapel_or_religious_services
        - special_units
        - dining_notes
        - other_notes
        - extractor_version
        - model
      properties:
        report_id:
          type: integer
          format: int64
          description: The report the amenities were read from.
        inspection_date:
          type: [string, "null"]
          format: date
          description: The date of that report's inspection, if it printed one.
        care_types:
          type: array
          items: {type: string}
        room_types:
          type: array
          items: {type: string}
        has_outdoor_space:
          type: [boolean, "null"]
          description: >
            A garden or outdoor space. True or false when the report says so,
            null when it is silent.
        activities:
          type: array
          items: {type: string}
        has_transport:
          type: [boolean, "null"]
          description: >
            Transport the centre itself provides for residents. Public
            transport nearby does not count. True or false when the report
            says so, null when it is silent.
        has_chapel_or_religious_services:
          type: [boolean, "null"]
          description: >
            A chapel or religious services. True or false when the report says
            so, null when it is silent.
        special_units:
          type: array
          items: {type: string}
          description: Specialist units or areas, such as a memory care unit.
        dining_notes:
          type: string
          description: What the report says about dining. Empty if nothing.
        other_notes:
          type: string
          description: Other notable facilities. Empty if nothing.
        extractor_version:
          type: string
          description: Which extraction wrote these, for example amenities-v1.
        model:
          type: string

    ReportResult:
      type: object
      required: [report]
      properties:
        report:
          $ref: "#/components/schemas/Report"

    Report:
      type: object
      description: One inspection report, as the parser read it.
      required:
        - report_id
        - centre_id
        - centre_code
        - centre_name
        - provider_name
        - address
        - inspection_type
        - inspection_date
        - fieldwork_id
        - residents
        - report_file
        - inspectors
        - regulations
        - compliance_items
      properties:
        report_id:
          type: integer
          format: int64
        centre_id:
          type: string
          pattern: "^[0-9]+$"
          description: HIQA's centre ID.
        centre_code:
          type: string
          description: >
            The Centre ID as the report prints it, such as OSV-0000117. The
            number behind it is centre_id.
        centre_name:
          type: string
          minLength: 1
        provider_name:
          type: [string, "null"]
        address:
          type: string
          minLength: 1
        inspection_type:
          type: [string, "null"]
        inspection_date:
          type: [string, "null"]
          format: date
        fieldwork_id:
          type: string
          minLength: 1
        residents:
          type: [integer, "null"]
          minimum: 0
        report_file:
          $ref: "#/components/schemas/ReportFile"
        inspectors:
          type: array
          description: The inspectors the report names, in the order it prints them.
          items:
            $ref: "#/components/schemas/ReportInspector"
        regulations:
          type: array
          description: The regulations the report considered, from Appendix 1.
          items:
            $ref: "#/components/schemas/ReportRegulation"
        compliance_items:
          type: array
          description: The report's compliance plan, in the order it prints it.
          items:
            $ref: "#/components/schemas/ReportComplianceItem"

    ReportFile:
      type: object
      description: The stored PDF this report was read from.
      required: [fetched_at, url, sha256]
      properties:
        fetched_at:
          type: string
          format: date-time
          description: >
            When ClearCare downloaded the report, in UTC to the second
            (YYYY-MM-DDTHH:MM:SSZ).
        url:
          type: string
          format: uri
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The SHA-256 of the downloaded file.

    ReportInspector:
      type: object
      description: An inspector named on a report, with the day and times they attended.
      required: [date, start_time, end_time, name, role]
      properties:
        date:
          type: string
          format: date
          description: The day the inspector attended.
        start_time:
          type: [string, "null"]
          format: time
        end_time:
          type: [string, "null"]
          format: time
        name:
          type: string
          minLength: 1
        role:
          type: [string, "null"]

    ReportRegulation:
      type: object
      description: A regulation a report considered, as Appendix 1 lists it.
      required: [regulation, title, judgment]
      properties:
        regulation:
          type: string
          minLength: 1
          description: The regulation's number, such as Regulation 15.
        title:
          type: string
          minLength: 1
          description: Its title, such as Staffing.
        judgment:
          type: string
          minLength: 1

    ReportComplianceItem:
      type: object
      description: One item of a report's compliance plan.
      required: [regulation, requirement, judgment, risk_rating, date_to_comply]
      properties:
        regulation:
          type: string
          minLength: 1
        requirement:
          type: string
          minLength: 1
          description: What the centre must change.
        judgment:
          type: [string, "null"]
        risk_rating:
          type: [string, "null"]
        date_to_comply:
          type: [string, "null"]
          format: date

    ReAssessmentStatistics:
      type: object
      required: [matrix, re_check_rate, coverage, data_date]
      properties:
        matrix:
          type: array
          items:
            $ref: "#/components/schemas/NextResultCounts"
        re_check_rate:
          type: array
          items:
            $ref: "#/components/schemas/ReCheckRate"
        coverage:
          $ref: "#/components/schemas/Coverage"
        data_date:
          type: string
          format: date
          description: The latest inspection date among the loaded reports.

    NextResultCounts:
      type: object
      description: >
        How many judgments of one starting judgment had each result at the
        centre's next report. The judgment columns count only the three
        spellings HIQA uses, and total counts every judgment, so a judgment
        printed another way is in total alone.
      required:
        - judgment
        - compliant
        - substantially_compliant
        - not_compliant
        - not_re_assessed
        - no_later_report
        - total
      properties:
        judgment:
          type: string
          enum: [Compliant, Substantially compliant, Not compliant]
          description: The starting judgment.
        compliant:
          type: integer
        substantially_compliant:
          type: integer
        not_compliant:
          type: integer
        not_re_assessed:
          type: integer
          description: The next report does not list the regulation.
        no_later_report:
          type: integer
          description: The judgment is from the centre's latest loaded report.
        total:
          type: integer

    ReCheckRate:
      type: object
      description: >
        Of the judgments of one starting judgment that have a later report,
        how many the next report judged again.
      required: [judgment, with_later_report, re_assessed, rate]
      properties:
        judgment:
          type: string
          enum: [Compliant, Substantially compliant, Not compliant]
          description: The starting judgment.
        with_later_report:
          type: integer
          description: The denominator, total less no_later_report.
        re_assessed:
          type: integer
          description: >
            The numerator, the sum of the compliant, substantially_compliant
            and not_compliant counts.
        rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: >
            re_assessed divided by with_later_report, not rounded. null when
            with_later_report is 0.

    Coverage:
      type: object
      description: How much of the data the counts rest on.
      required:
        - reports_loaded
        - centres_with_two_or_more_reports
        - reports_paired
        - judgments_paired
      properties:
        reports_loaded:
          type: integer
        centres_with_two_or_more_reports:
          type: integer
          description: Centres with two or more loaded reports.
        reports_paired:
          type: integer
          description: >
            Reports paired with the centre's next report. A report that judged
            no regulation is not counted.
        judgments_paired:
          type: integer
          description: Judgments of the paired reports.

    Problem:
      type: object
      description: >
        An error, as defined by RFC 9457. `type` is left out, which means
        `about:blank`: the status code says what kind of error it is.
      required: [title, status, detail]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: What was wrong, in English.
        instance:
          type: string
          description: The path of the request.

    SavedSearch:
      type: object
      description: >
        The search an account asked the site to remember: the county, the
        order, and the ticked options by their slug from the page address
        (`en-suite`), not the amenity item names the rest of this API takes
        (`En-suite facilities`). The four list keys are the ones a centre
        carries, so a stored preference reads the same way as the data it
        searches. One document rather than a column per filter, so a filter
        added to the site needs nothing here.
      required: [county, care_types, room_types, facilities, activities, sort_by]
      properties:
        county:
          type: [string, "null"]
          description: >
            One county as the register spells it, or null for any county. The
            site drops a county the register does not have rather than storing
            it.
        care_types:
          type: array
          description: The ticked care-type slugs, in the order the page offers them.
          items:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        room_types:
          type: array
          description: The ticked room-type slugs.
          items:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        facilities:
          type: array
          description: The ticked facility slugs.
          items:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        activities:
          type: array
          description: The ticked activity slugs.
          items:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        sort_by:
          type: string
          enum: [name, latest_inspection]

    SavedSearchResult:
      type: object
      description: >
        The account's saved search, and when it was last saved. Both are null
        when the account has not saved one.
      required: [preferences, updated_at]
      properties:
        preferences:
          oneOf:
            - $ref: "#/components/schemas/SavedSearch"
            - type: "null"
        updated_at:
          type: [string, "null"]
          format: date-time
          description: When the saved search was last stored, to the second.
