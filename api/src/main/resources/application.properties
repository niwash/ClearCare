# The API logs in as clearcare_api, which can only read what the migrations
# grant it (ADR-0010). Its password comes from the environment. To reach a
# database on another host, set SPRING_DATASOURCE_URL.
spring.datasource.url=jdbc:postgresql://127.0.0.1:${CLEARCARE_DB_PORT:5432}/clearcare
spring.datasource.username=clearcare_api
spring.datasource.password=${CLEARCARE_API_PASSWORD}
