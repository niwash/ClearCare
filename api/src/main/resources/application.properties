# The API logs in as clearcare_api, which reads the views the migrations create and writes two tables
# of its own, an account and that account's saved search (db/V15, ADR-0025). Its password comes from
# the environment. To reach a database on another host, set SPRING_DATASOURCE_URL.
spring.datasource.url=jdbc:postgresql://127.0.0.1:${CLEARCARE_DB_PORT:5432}/clearcare
spring.datasource.username=clearcare_api
spring.datasource.password=${CLEARCARE_API_PASSWORD}

# The token the site's server sends with every request it makes on a visitor's behalf, which is how
# the API knows a request is the site's and not a stranger naming an account (ADR-0025). One value
# covers every such feature, not one secret each, because it proves the caller and says nothing
# about what is wanted. It also guards /centres/points, which is about no account (ADR-0029). Unset,
# both answer 503 and the site hides the saved-search controls, so a checkout without it behaves as
# it did.
clearcare.site.token=${SITE_TOKEN:}

# JSON property names are snake_case, the same as the view columns (api/openapi.yaml).
spring.jackson.property-naming-strategy=SNAKE_CASE
# Errors are application/problem+json (RFC 9457).
spring.mvc.problemdetails.enabled=true
