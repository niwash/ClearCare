# ClearCare on one machine: the database, the API and the pipeline.
# CONTRIBUTING.md explains how to use it.

services:
  db:
    # The same image as the database tests in pipeline/tests.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      # infra/postgres/roles.sql expects this database name.
      POSTGRES_DB: clearcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see .env.example}
      CLEARCARE_MIGRATOR_PASSWORD: ${CLEARCARE_MIGRATOR_PASSWORD:?see .env.example}
      CLEARCARE_PIPELINE_PASSWORD: ${CLEARCARE_PIPELINE_PASSWORD:?see .env.example}
      CLEARCARE_API_PASSWORD: ${CLEARCARE_API_PASSWORD:?see .env.example}
    ports:
      - 127.0.0.1:${CLEARCARE_DB_PORT:-5432}:5432
    volumes:
      - db-data:/var/lib/postgresql
      - ./infra/postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      # Over TCP: while the init scripts run, the server listens only on its
      # socket, so this passes, and Flyway starts, after roles.sql has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "clearcare"]
      interval: 2s
      retries: 15

  # Applies the migrations in db/ and exits (ADR-0010).
  migrate:
    image: flyway/flyway:13.9.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/clearcare
      FLYWAY_USER: clearcare_migrator
      FLYWAY_PASSWORD: ${CLEARCARE_MIGRATOR_PASSWORD:?see .env.example}
      # Flyway 13 marks initSql as deprecated but still runs it. Move this to an
      # afterConnect callback when upgrading.
      FLYWAY_INIT_SQL: SET ROLE clearcare_owner
      # V1 creates the clearcare schema itself, so Flyway is not told about it
      # and keeps its history table in public.
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/clearcare
      CLEARCARE_API_PASSWORD: ${CLEARCARE_API_PASSWORD:?see .env.example}
    ports:
      - 127.0.0.1:${CLEARCARE_API_PORT:-8080}:8080
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Downloads from HIQA when due and loads the database
  # (pipeline/src/clearcare_pipeline/schedule).
  pipeline:
    build:
      context: ./pipeline
      args:
        # Stored with every row the pipeline loads.
        CLEARCARE_PIPELINE_VERSION: ${CLEARCARE_PIPELINE_VERSION:-local}
    # The image's entrypoint is python -m.
    command: [clearcare_pipeline.schedule, --data-dir, /data]
    # The owner of the data directory, so that the pipeline can write to it.
    user: ${CLEARCARE_PIPELINE_UID:-1000}:${CLEARCARE_PIPELINE_GID:-1000}
    # Passes docker stop on to Python, which ignores it as process 1.
    init: true
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: clearcare
      PGUSER: clearcare_pipeline
      PGPASSWORD: ${CLEARCARE_PIPELINE_PASSWORD:?see .env.example}
      CLEARCARE_CRAWL: ${CLEARCARE_CRAWL:-off}
      CLEARCARE_S3_ENDPOINT: ${CLEARCARE_S3_ENDPOINT:-}
      CLEARCARE_S3_REGION: ${CLEARCARE_S3_REGION:-}
      CLEARCARE_S3_BUCKET: ${CLEARCARE_S3_BUCKET:-}
      CLEARCARE_S3_ACCESS_KEY_ID: ${CLEARCARE_S3_ACCESS_KEY_ID:-}
      CLEARCARE_S3_SECRET_ACCESS_KEY: ${CLEARCARE_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ${CLEARCARE_DATA_DIR:-./data}:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
