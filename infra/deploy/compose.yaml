# The VM's settings on top of the root compose.yaml (ADR-0011, ADR-0014).
# README.md in this folder explains how to use it.

name: clearcare

services:
  db:
    # Named, so that the API reaches it as clearcare-db. The API is also on
    # the proxy's network, where another "db" may exist.
    container_name: clearcare-db
    # Only containers on this project's network reach the database.
    ports: !reset []

  # migrate and api keep the settings they had before this file was an
  # override, so that the change of files alone does not recreate them.
  migrate:
    environment:
      FLYWAY_URL: jdbc:postgresql://clearcare-db:5432/clearcare

  api:
    image: clearcare-api
    container_name: clearcare-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://clearcare-db:5432/clearcare
    # The proxy reaches the API as clearcare-api:8080 on its own network.
    ports: !reset []
    networks:
      - default
      - proxy

  pipeline:
    user: "1001:1001"
    environment:
      CLEARCARE_CRAWL: all
    volumes:
      - /opt/clearcare/data:/data

networks:
  proxy:
    external: true
    name: eco-return_backend-net
