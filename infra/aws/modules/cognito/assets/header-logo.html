<!--
  ClearCare wordmark for the top of the managed login pages (PAGE_HEADER_LOGO).

  The site's own header, in miniature: the name in Source Serif 4 over the motto in Public Sans,
  white on the brand band (#21405c light, #132a40 dark), which is what the page header paints
  behind it. On a phone managed login drops the background artwork entirely, so this band is the
  only thing on screen that says whose sign-in page this is; on desktop it sits where the site's
  navigation does.

  Re-render after a change with:

    cd infra/aws/modules/cognito/assets
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
      --hide-scrollbars --force-device-scale-factor=3 --virtual-time-budget=10000 \
      --default-background-color=00000000 --window-size=320,80 \
      --screenshot=/tmp/logo.png "file://$PWD/header-logo.html"

  Then trim the transparent margin and save as header-logo.png.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClearCare wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 320px; height: 80px; background: transparent; }
  .mark { display: inline-flex; flex-direction: column; justify-content: center; gap: 2px;
          padding: 6px 0 6px 4px; }
  .name { font-family: "Source Serif 4", Georgia, serif; font-weight: 600;
          font-size: 30px; line-height: 34px; color: #ffffff;
          font-variation-settings: "opsz" 14; }
  .motto { font-family: "Public Sans", Arial, sans-serif; font-weight: 400;
           font-size: 13px; line-height: 16px; color: rgba(255, 255, 255, 0.88); }
</style>
</head>
<body>
  <div class="mark">
    <span class="name">ClearCare</span>
    <span class="motto">Nursing home inspections, made clear</span>
  </div>
</body>
</html>
