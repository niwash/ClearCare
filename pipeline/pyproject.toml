[project]
name = "clearcare-pipeline"
version = "0.1.0"
description = "ClearCare data pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.43.103",
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.103",
    "pyright>=1.1.414",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearcare_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=clearcare_pipeline --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
